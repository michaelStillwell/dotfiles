[general]
# import = ["alacritty-theme/themes/gruvbox_dark.toml"]
import = ["./kanagawa_dragon.toml"]

[terminal]
shell = "zellij options --default-shell nu"

[window]
decorations = "None"
padding = { x = 0, y = 10 }
startup_mode = "Maximized"

[font]
size = 10
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "ExtraBold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }

[colors]
primary.background = "#000000"
